<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#123c69" />
  <title>Amharic Flashcards</title>

  <style>
    :root {
      --navy: #123c69;
      --blue: #1d73ba;
      --green: #168052;
      --paper: #f4f8fb;
      --white: #ffffff;
      --border: #d6e2eb;
      --muted: #65737f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #18232d;
      background: var(--paper);
      font-family: Arial, "Noto Sans Ethiopic", "Nyala", sans-serif;
    }

    header {
      padding: 28px 16px;
      color: white;
      background: linear-gradient(135deg, #0d3158, #1d73ba);
    }

    .container {
      width: min(800px, calc(100% - 28px));
      margin: auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 6vw, 2.8rem);
    }

    header p {
      margin: 10px 0 0;
      color: #dceefd;
    }

    main {
      padding: 26px 0 48px;
    }

    .card {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--white);
      box-shadow: 0 8px 24px rgba(18, 60, 105, 0.10);
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    h2 {
      margin: 0;
      color: var(--navy);
    }

    select {
      min-height: 43px;
      padding: 8px 12px;
      border: 1px solid #b9ccda;
      border-radius: 9px;
      background: white;
      font: inherit;
    }

    .instructions {
      color: var(--muted);
      line-height: 1.45;
    }

    /*
      English question side:
      blue and light-blue background.
    */
    .flashcard.question-side {
      color: #123c69;
      border-color: #b9d9ee;
      background: linear-gradient(135deg, #e4f4ff, #ffffff);
    }

    /*
      Amharic answer side:
      green and gold background.
    */
    .flashcard.answer-side {
      color: #084c30;
      border-color: #8fcdb0;
      background: linear-gradient(135deg, #d9f6e6, #fff8d8);
    }

    .flashcard {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 275px;
      margin-top: 18px;
      padding: 25px;
      cursor: pointer;
      text-align: center;
      border: 3px solid #c6ddeb;
      border-radius: 18px;
      font-size: clamp(1.55rem, 6vw, 2.5rem);
      font-weight: bold;
      touch-action: manipulation;
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .flashcard:hover {
      transform: translateY(-3px);
    }

    .flashcard.flipping {
      transform: rotateY(90deg);
    }

    .flashcard small {
      display: block;
      margin-top: 16px;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 0.85rem;
      font-weight: normal;
    }

    .flashcard.answer-side small {
      color: #35634d;
    }

    .counter {
      margin: 14px 0;
      color: var(--muted);
      text-align: center;
      font-size: 0.92rem;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    button {
      min-height: 46px;
      padding: 10px 12px;
      cursor: pointer;
      border: 0;
      border-radius: 10px;
      color: white;
      background: var(--blue);
      font: inherit;
      font-weight: bold;
    }

    .hear-button {
      background: var(--green);
    }

    .home-link {
      display: inline-block;
      margin-top: 22px;
      color: var(--navy);
      font-weight: bold;
    }

    @media (max-width: 520px) {
      .buttons {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 15px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <h1>Amharic Flashcards</h1>
      <p>Tap the card to flip from English to the Amharic answer.</p>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div class="top-row">
        <h2>Study Flashcards</h2>

        <select id="category" onchange="changeCategory()">
          <option value="words">Matching Game Words</option>
          <option value="sentences">Amharic Sentences</option>
        </select>
      </div>

      <p class="instructions">
        The blue card is the English question. Tap it to flip to the green-and-gold Amharic answer.
      </p>

      <div
        class="flashcard question-side"
        id="flashcard"
        onclick="flipCard()"
        role="button"
        tabindex="0"
      ></div>

      <p class="counter" id="counter"></p>

      <div class="buttons">
        <button onclick="previousCard()">← Previous</button>
        <button class="hear-button" onclick="hearAmharic()">🔊 Hear Amharic</button>
        <button onclick="nextCard()">Next →</button>
      </div>

      <a class="home-link" href="index.html">
        ← Return to Home Page
      </a>
    </section>
  </main>

  <script>
    const wordCards = [
      ["Jesus", "ኢየሱስ"],
      ["God", "እግዚአብሔር"],
      ["Lord", "ጌታ"],
      ["Mary", "ማርያም"],
      ["David", "ዳዊት"],
      ["Moses", "ሙሴ"],
      ["Peter", "ጴጥሮስ"],
      ["Paul", "ጳውሎስ"],
      ["John", "ዮሐንስ"],
      ["Abraham", "አብርሃም"],

      ["Love", "ፍቅር"],
      ["Peace", "ሰላም"],
      ["Faith", "እምነት"],
      ["Prayer", "ጸሎት"],
      ["Hope", "ተስፋ"],
      ["Life", "ሕይወት"],
      ["Light", "ብርሃን"],
      ["Heaven", "ሰማይ"],
      ["Angel", "መልአክ"],
      ["Gospel", "ወንጌል"],

      ["Holy Bible", "መጽሐፍ ቅዱስ"],
      ["Jerusalem", "የሩሳሌም"],
      ["Galilee", "ገሊላ"],
      ["Bethlehem", "ቤተ ልሔም"],
      ["Egypt", "ግብጽ"],
      ["Water", "ውኃ"],
      ["Bread", "እንጀራ"],
      ["Cross", "መስቀል"],
      ["Church", "ቤተ ክርስቲያን"],
      ["King", "ንጉሥ"],

      ["Pray", "ጸልይ"],
      ["Love", "ውደድ"],
      ["Read", "አንብብ"],
      ["Sing", "ዘምር"],
      ["Go", "ሂድ"],
      ["Give", "ስጥ"],
      ["Good", "ቸር"],
      ["Holy", "ቅዱስ"],
      ["Happy", "ደስተኛ"],
      ["Child", "ልጅ"],

      ["I", "እኔ"],
      ["You", "አንተ"],
      ["We", "እኛ"],
      ["They", "እነርሱ"],
      ["Day", "ቀን"],
      ["Night", "ሌሊት"],
      ["Sun", "ፀሐይ"],
      ["Seed", "ዘር"],
      ["Lamb", "በግ"],
      ["Disciple", "ደቀ መዝሙር"]
    ];

    const sentenceCards = [
      ["Jesus is Lord.", "ኢየሱስ ጌታ ነው።"],
      ["God is love.", "እግዚአብሔር ፍቅር ነው።"],
      ["The Lord is good.", "ጌታ ቸር ነው።"],
      ["God gives peace.", "እግዚአብሔር ሰላም ይሰጣል።"],
      ["We pray.", "እኛ እንጸልያለን።"],
      ["I love God.", "እግዚአብሔርን እወዳለሁ።"],
      ["David sings.", "ዳዊት ይዘምራል።"],
      ["Mary is happy.", "ማርያም ደስተኛ ናት።"],
      ["The child reads.", "ልጁ ያነባል።"],
      ["Peace be with you.", "ሰላም ለእናንተ ይሁን።"]
    ];

    let cards = wordCards;
    let cardIndex = 0;
    let showAmharic = false;

    function renderCard() {
      const card = cards[cardIndex];
      const flashcard = document.getElementById("flashcard");

      const text = showAmharic ? card[1] : card[0];

      const label = showAmharic
        ? "Answer — Amharic"
        : "Question — English";

      const helper = showAmharic
        ? "Tap the card to return to the English question"
        : "Tap the card to flip and see the Amharic answer";

      flashcard.className = showAmharic
        ? "flashcard answer-side"
        : "flashcard question-side";

      flashcard.innerHTML = `
        <div>
          <small>${label}</small>

          <div style="margin-top: 12px;">
            ${text}
          </div>

          <small>${helper}</small>
        </div>
      `;

      document.getElementById("counter").textContent =
        `Flashcard ${cardIndex + 1} of ${cards.length}`;
    }

    function flipCard() {
      const flashcard = document.getElementById("flashcard");

      flashcard.classList.add("flipping");

      setTimeout(() => {
        showAmharic = !showAmharic;
        renderCard();
      }, 120);

      setTimeout(() => {
        flashcard.classList.remove("flipping");
      }, 280);
    }

    function nextCard() {
      cardIndex = (cardIndex + 1) % cards.length;
      showAmharic = false;
      renderCard();
    }

    function previousCard() {
      cardIndex =
        (cardIndex - 1 + cards.length) % cards.length;

      showAmharic = false;
      renderCard();
    }

    function changeCategory() {
      const category = document.getElementById("category").value;

      cards =
        category === "words"
          ? wordCards
          : sentenceCards;

      cardIndex = 0;
      showAmharic = false;

      renderCard();
    }

    function hearAmharic() {
      if (!("speechSynthesis" in window)) return;

      speechSynthesis.cancel();

      const speech = new SpeechSynthesisUtterance(
        cards[cardIndex][1]
      );

      speech.lang = "am-ET";
      speech.rate = 0.72;

      speechSynthesis.speak(speech);
    }

    document.getElementById("flashcard").addEventListener(
      "keydown",
      event => {
        if (event.key === "Enter" || event.key === " ") {
          flipCard();
        }
      }
    );

    renderCard();
  </script>
</body>
</html>
